<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Counter Web FPS</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* HUD & Controls */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: rgba(0, 255, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #shootBtn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.6);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #shootBtn:active {
            background: rgba(255, 0, 0, 0.9);
        }
        #joystickZone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
        }
        #joystickKnob {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>
    <div id="crosshair"></div>
    <div id="shootBtn">FIRE</div>
    
    <div id="joystickZone">
        <div id="joystickKnob"></div>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.5, 0.7, 1);

            // ایجاد دوربین اول شخص
            const camera = new BABYLON.UniversalCamera("camera1", new BABYLON.Vector3(0, 1.8, -10), scene);
            camera.setTarget(BABYLON.Vector3.Zero());
            camera.minZ = 0.1;
            camera.angularSensibility = 2000;

            // نورپردازی
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            // زمین (Map)
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 60, height: 60}, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            ground.material = groundMat;

            // هدف‌ها (Targets)
            for (let i = 0; i < 5; i++) {
                const box = BABYLON.MeshBuilder.CreateBox("target", {size: 2}, scene);
                box.position = new BABYLON.Vector3((i - 2) * 5, 1, 10);
                const boxMat = new BABYLON.StandardMaterial("boxMat", scene);
                boxMat.diffuseColor = new BABYLON.Color3(1, 0, 0);
                box.material = boxMat;
                box.isTarget = true;
            }

            // مدل اسلحه ساده در دست بازیکن
            const gun = BABYLON.MeshBuilder.CreateBox("gun", {width: 0.2, height: 0.2, depth: 0.8}, scene);
            gun.parent = camera;
            gun.position = new BABYLON.Vector3(0.3, -0.3, 0.6);
            const gunMat = new BABYLON.StandardMaterial("gunMat", scene);
            gunMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            gun.material = gunMat;

            // جوی‌استیک لمسی حرکتی
            let moveVector = new BABYLON.Vector2(0, 0);
            const joystickZone = document.getElementById("joystickZone");
            const joystickKnob = document.getElementById("joystickKnob");
            let joystickTouchId = null;

            joystickZone.addEventListener("touchstart", (e) => {
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
            });

            window.addEventListener("touchmove", (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    }
                }
            });

            const resetJoystick = () => {
                joystickTouchId = null;
                moveVector = new BABYLON.Vector2(0, 0);
                joystickKnob.style.left = "50px";
                joystickKnob.style.top = "50px";
            };

            window.addEventListener("touchend", (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        resetJoystick();
                    }
                }
            });

            function updateJoystick(touch) {
                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                let deltaX = touch.clientX - centerX;
                let deltaY = touch.clientY - centerY;
                const distance = Math.min(Math.sqrt(deltaX * deltaX + deltaY * deltaY), 50);
                const angle = Math.atan2(deltaY, deltaX);

                const knobX = 50 + distance * Math.cos(angle);
                const knobY = 50 + distance * Math.sin(angle);
                joystickKnob.style.left = `${knobX}px`;
                joystickKnob.style.top = `${knobY}px`;

                moveVector.x = (distance / 50) * Math.cos(angle);
                moveVector.y = (distance / 50) * Math.sin(angle);
            }

            // چرخش دوربین با Swipe روی سمت راست صفحه
            let lookTouchId = null;
            let lastTouchX = 0;
            let lastTouchY = 0;

            window.addEventListener("touchstart", (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.clientX > window.innerWidth / 2 && lookTouchId === null) {
                        lookTouchId = touch.identifier;
                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }
                }
            });

            window.addEventListener("touchmove", (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === lookTouchId) {
                        const deltaX = touch.clientX - lastTouchX;
                        const deltaY = touch.clientY - lastTouchY;
                        camera.rotation.y += deltaX * 0.005;
                        camera.rotation.x += deltaY * 0.005;
                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }
                }
            });

            window.addEventListener("touchend", (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            });

            // اعمال حرکت به بازیکن در هر فریم
            scene.onBeforeRenderObservable.add(() => {
                const speed = 0.15;
                if (moveVector.length() > 0) {
                    const forward = camera.getDirection(BABYLON.Axis.Z);
                    const right = camera.getDirection(BABYLON.Axis.X);
                    forward.y = 0;
                    right.y = 0;
                    forward.normalize();
                    right.normalize();

                    const moveDir = forward.scale(-moveVector.y).add(right.scale(moveVector.x));
                    camera.position.addInPlace(moveDir.scale(speed));
                }
            });

            // شلیک تیر
            const shootBtn = document.getElementById("shootBtn");
            shootBtn.addEventListener("click", () => {
                const ray = camera.getForwardRay();
                const hit = scene.pickWithRay(ray);

                if (hit.hit && hit.pickedMesh && hit.pickedMesh.isTarget) {
                    hit.pickedMesh.dispose(); // حذف هدف در صورت اصابت
                }
            });

            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(() => { scene.render(); });
        window.addEventListener("resize", () => { engine.resize(); });
    </script>
</body>
</html>
